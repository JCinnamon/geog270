<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOG 270 Student Map Gallery</title>
<meta name="theme-color" content="#2c5f7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232c5f7a'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%237fd4c8' stroke-width='2.5'/%3E%3Cpath d='M16 7.5v17M7.5 16h17' stroke='%237fd4c8' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#1e4260;}
  .top{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:1rem;padding:0 1rem;background:#fff;border-bottom:1px solid #dde8ed;z-index:2;}
  .top a.back{font-size:.8125rem;font-weight:600;color:#2c5f7a;text-decoration:none;white-space:nowrap;padding:.35rem .8rem;border:1.5px solid #2c5f7a;border-radius:20px;}
  .top a.back:hover{background:#2c5f7a;color:#fff;}
  .t{flex:1;min-width:0;line-height:1.25;} .t b{display:block;font-size:.95rem;color:#1e4260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .t span{font-size:.78rem;color:#64748b;}
  .top button{font:600 .8125rem 'Inter',sans-serif;color:#1a9080;background:none;border:none;cursor:pointer;white-space:nowrap;}
  iframe{position:fixed;left:0;right:0;top:52px;bottom:0;width:100%;height:calc(100% - 52px);border:0;background:#fff;}
  .msg{position:fixed;inset:52px 0 0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem;}
</style>
</head>
<body>
<div class="top"><a class="back" href="./">← Gallery</a><div class="t"><b id="tt">Loading…</b><span id="tb"></span></div><button id="fs" title="Full screen">⛶ Full screen</button></div>
<div class="msg" id="msg"></div>
<script>
(function(){
  var id=(new URLSearchParams(location.search).get('id')||'').toLowerCase();
  var tt=document.getElementById('tt'), tb=document.getElementById('tb'), msg=document.getElementById('msg');
  if(!/^[a-z0-9-]+$/.test(id)){ tt.textContent='Not found'; msg.textContent='That piece is not in the gallery.'; return; }
  fetch('gallery.json?'+Date.now()).then(function(r){ return r.json(); }).then(function(g){
    var it=(g.items||[]).filter(function(x){ return x.id===id; })[0];
    if(!it){ tt.textContent='Not found'; msg.textContent='That piece is not in the gallery (it may have been removed).'; return; }
    document.title=it.title+' — GEOG 270 Student Map Gallery';
    tt.textContent=it.title; tb.textContent=(it.kind==='atlas'?'Atlas':'Map')+' by '+it.credit+(it.term?' · '+it.term:'');
    /* student work runs in a sandbox: its scripts can't reach this site or its visitors' data */
    var f=document.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads');
    f.setAttribute('allow','fullscreen'); f.setAttribute('allowfullscreen','');
    f.title=it.title; f.src='work/'+id+'.html';
    document.body.appendChild(f);
    document.getElementById('fs').onclick=function(){ (f.requestFullscreen||f.webkitRequestFullscreen||function(){}).call(f); };
  }).catch(function(){ tt.textContent='Could not load the gallery'; });
})();
</script>
</body>
</html>
